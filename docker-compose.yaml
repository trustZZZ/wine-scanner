services:
  # ──────────────── API (FastAPI + Gunicorn) ────────────────
  api:
    build: .
    command: gunicorn --worker-class uvicorn.workers.UvicornWorker -w 4 --bind 0.0.0.0:8000 app.main:app
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    volumes:
      - ./app:/app/app        # хот-релоад в деве (убрать в проде)
    networks:
      - wine-net

  # ──────────────── Celery Worker ────────────────
  worker:
    build: .
    command: celery -A app.tasks.celery_app worker -l info -Q scan --concurrency=2
    restart: unless-stopped
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - wine-net

  # ──────────────── PostgreSQL ────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-wine_scanner}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"            # убрать в проде или ограничить
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wine-net

  # ──────────────── Redis ────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wine-net

  # ──────────────── MinIO (S3-совместимое хранилище) ────────────────
  minio:
    image: minio/minio:RELEASE.2024-06-12T18-23-27Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"            # API
      - "9001:9001"            # веб-консоль
    volumes:
      - miniodata:/data
    networks:
      - wine-net

  # ──────────────── Nginx (reverse proxy) ────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - wine-net

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  wine-net:
    driver: bridge
