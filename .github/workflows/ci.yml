name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wine_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd "ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Миграции (обязательно перед тестами, иначе будет relation does not exist)
      - name: Apply DB migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/wine_test

      # Тесты с PYTHONPATH=., чтобы import app работал
      - name: Run tests with coverage
        run: PYTHONPATH=. pytest --cov=app --cov-report=xml
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/wine_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci
          ALGORITHM: HS256
          MINIO_ENDPOINT: http://localhost:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          MINIO_BUCKET: wine-labels
