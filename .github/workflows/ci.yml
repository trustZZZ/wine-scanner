name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # Оставляем ТОЛЬКО Postgres: он нужен для миграций и SQL-тестов
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wine_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ВАЖНО: ждём готовности БД перед миграциями
      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      # Миграции: обязательно перед тестами, иначе relation does not exist
      - name: Apply DB migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/wine_test

      # Тесты: PYTHONPATH=. решает проблему import app
      # Переменные для Redis/MinIO НЕ передаём — они не нужны, так как всё замокано
      - name: Run tests with coverage
        run: PYTHONPATH=. pytest --cov=app --cov-report=xml
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/wine_test
          SECRET_KEY: test-secret-key-for-ci
          ALGORITHM: HS256
          # REDIS_URL, MINIO_* — удалены! Не нужны, если в тестах всё замокано.
